<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Khem Raj Pradhan</title>
  <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --obsidian: #080807;
      --cream: #f9f6ef;
      --ink: #1c1c1a;
      --ink-soft: #4a4a44;
      --ink-muted: #7a7a70;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--obsidian);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .wrap { max-width: 560px; }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      margin-bottom: 32px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 600;
      line-height: 1;
      color: var(--cream);
      margin-bottom: 8px;
    }
    h1 em { color: var(--gold); font-style: italic; }
    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.45);
      margin-bottom: 48px;
    }
    .btn {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      background: var(--gold);
      color: var(--obsidian);
      padding: 16px 32px;
      transition: opacity 0.3s, transform 0.3s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-2px); }
    .divider {
      width: 42px;
      height: 2px;
      background: var(--gold);
      margin: 0 auto 32px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="code">:: ERROR 404 ::</p>
    <h1>Lost in <em>the System</em></h1>
    <div class="divider"></div>
    <p class="subtitle">Page Not Found</p>
    <p>The page you are looking for does not exist or has been moved. This happens sometimes. What matters is finding your way back.</p>
    <a href="/" class="btn">Return to Home</a>
  </div>
</body>
</html>
